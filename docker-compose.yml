services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: handlepay
      POSTGRES_USER: handlepay
      POSTGRES_PASSWORD: handlepay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handlepay -d handlepay"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - handlepay-postgres:/var/lib/postgresql/data

volumes:
  handlepay-postgres:
