<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <style>
      .icon { fill: none; stroke: #682e3c; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .accent { fill: #b9ff38; }
    </style>
  </defs>

  <!-- Orbit (circle with arrow) -->
  <path class="icon" d="M 55,15 A 32,32 0 1,1 15,55" />
  <polygon points="48,8 63,15 48,22" fill="#682e3c" />
  <circle cx="20" cy="70" r="5" fill="#682e3c" />

  <!-- Shield -->
  <path class="icon" d="M 25,30 L 40,20 L 55,30 V 50 C 55,65 40,75 40,75 C 40,75 25,65 25,50 Z" />
  
  <!-- Keyhole / Node -->
  <circle cx="40" cy="40" r="5" fill="#682e3c" />
  <line x1="40" y1="40" x2="40" y2="65" class="icon" stroke-width="4" />

  <!-- Accent dot -->
  <circle cx="70" cy="25" r="4" class="accent" />
</svg>
